var g_keys=[];//global
function get_keys2(){var dd=[],ms=[],i=0; //делаем ключи для автозавершения
  ms=g_dict.split('\n');
  g_keys=[];for(i=0;i<ms.length;i++){dd=ms[i].split('[');if(dd.length>1)g_keys.push(dd[0]);}
  return g_keys.length;
}
function show_perevod() {var w,t,o,d,n1,n2,da;//ищем слово в словаре
  w=elv('id_input','v');if(!w)return;
  w=w.toLowerCase();
  w=w.trim();
  w=replace_all(w,' ','-');
  n1=g_dict.indexOf('\n'+w+'[');
  if(n1<0){
    elv('id_output','t','нет такого слова (если глючит - перезагрузите стр)');
    elv('id_txt','h','*');
    return;
  }
  n2=n1+1;
  while(1){ // добавляем примеры к слову
    n2=g_dict.indexOf('\n',n2+1);
    if(g_dict.charAt(n2+1)!='#')break;
  }
  o=g_dict.substring(n1+1,n2);
  o=replace_all(o,';','; ');
  o=replace_all(o,'[','</b> <a>[');
  o=replace_all(o,']',']</a> ');
  o=replace_all(o,'\n','<br>');
  o=replace_all(o,'#','<hr>');
  elv('id_output','h','<b>'+o);
  elv('id_txt','h',get_fa(w));
}
function loader3(){
  log('словарь загружен, делаем keys');  
  lang = "en";
  var v=get_keys2();
  log('keys сделаны='+v); 
  suggest_entry();
}
function suggest_entry() {
  var demo1 = new autoComplete({
    selector: '#id_input',
    minChars: 3,
    source: function(term, suggest){
      term = term.toLowerCase();
      var choices=g_keys;
      var suggestions=[];
      for(var i=0;i<choices.length;i++)if(~choices[i].toLowerCase().indexOf(term)) if(elv('id_all').checked || choices[i].startsWith(term))suggestions.push(choices[i]);
      suggest(suggestions);
    }
  });
}
