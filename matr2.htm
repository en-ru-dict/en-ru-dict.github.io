<style>
:root {
  --accent: #00f2fe;
  --accent-glow: rgba(0, 242, 254, 0.5);
  --success: #10b981;
  --fail: #ef4444;
  --card-border: rgba(255, 255, 255, 0.08);
  --card-fs: 2rem;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
body {

}
.buttons-row {

  gap: 10px;

.glass-btn {

#card-area {

  justify-content: center;
  align-items: center;
  position: relative;

}
.card {

  height: 65vh;
  max-height: 500px;
  position: absolute;

  -webkit-transform-style: preserve-3d;

}
.card.swiping {
  transition: none;
  -webkit-transition: none;
}
.card-face {
  position: absolute;

  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 24px;
  background: #1e1e38;

  align-items: center;

  text-align: center;

  -webkit-transition: border-color 0.5s ease;

.card:hover .card-face {

}
.card-front {

.card-back {

.card-back-content {

  flex-direction: column;

}

@keyframes pulse {

  50% { opacity: 0.9; }
}
@-webkit-keyframes pulse {

  50% { opacity: 0.9; }

<script>
//=========matr.js========
// --- Simple Confetti ---
var g_canvas = document.getElementById('confetti');
if(!g_canvas){alert('нет канваса');}
var g_ctx = g_canvas.getContext('2d');
var g_cubs = [];

function resizeCanvas() {
  g_canvas.width = window.innerWidth; g_canvas.height = window.innerHeight;
}
//main
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function fireConfetti() {
  g_cubs = [];
  const colors = ['#00f2fe', '#4facfe', '#fcd34d', '#10b981', '#ef4444'];
  for(let i=0; i<80; i++) {
    g_cubs.push({
      x: g_canvas.width / 2,
      y: g_canvas.height,
      vx: (Math.random() - 0.5) * 16,
      vy: (Math.random() - 1) * 16 - 4,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      rs: (Math.random() - 0.5) * 8
    });
  }
  animateConfetti();
}
function animateConfetti() {
  if(g_cubs.length === 0){g_ctx.clearRect(0,0,g_canvas.width,g_canvas.height); return;}
  g_ctx.clearRect(0,0,g_canvas.width,g_canvas.height);
  for (let i = g_cubs.length - 1; i >= 0; i--) {
    const p = g_cubs[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.rot += p.rs;// gravity
    g_ctx.save();
    g_ctx.translate(p.x, p.y);
    g_ctx.rotate(p.rot * Math.PI / 180);
    g_ctx.fillStyle = p.color;
    g_ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
    g_ctx.restore();
    if(p.y > g_canvas.height){g_cubs.splice(i, 1);}
  }
  requestAnimationFrame(animateConfetti);
}
//подсветка слова тр перевода и звуков
function zv_zagl(s,a){var le,i,w,out;
 s=''+s;
 //s=replace_all(s,'.','. ');
 s=replace_all(s,',',', ');
 s=replace_all(s,';','; ');
 s=replace_all(s,'!','! ');

 s=replace_all(s,'(',' (');
 s=replace_all(s,'[',' [');
 s=replace_all(s,'{',' {');

 s=replace_all(s,')',') ');
 s=replace_all(s,']','] ');
 s=replace_all(s,'}','} ');

 var ru1='-йцукенгшщзхъфывапролджэячсмитьбюё'
 var ru2='-ЙЦУКЕНГШЩЗХЪФЫВАПРОЛДЖЭЯЧСМИТЬБЮЁ';
 var ru3=ru1+ru2;
 var en1='-qwertyuiopasdfghjklzxcvbnm';
 var en2='-QWERTYUIOPASDFGHJKLZXCVBNM';
 var en3=en1+en2;

 s=s+' ';le=s.length;out='';
 var f_a=0,f_b=0,f_i=0,f_en=0,f_tr1=0,f_tr2=0;
 if(a){out='<a>';f_a=1;}//первое слово выделяем

 for(i=0;i<le;i++){
  w=s.charAt(i);
  if(f_a){
   if(' /|'.indexOf(w)>=0){f_a=0;out+='</a>'+w;continue;}
   out+=w; continue; //остальное игнорим
  }
  if(!f_tr1)if(w==='['){f_tr1=1;out+='<span>[';continue;}
  if(f_tr1){//транскрипция внутри ФА []
   if(w===']'){f_tr1=0;out+=']</span>';continue;}
   out+=w; continue; //остальное игнорим
  }
  if(!f_tr2)if(w==='~'){f_tr2=1;out+='<span>~';continue;}
  if(f_tr2){//транскрипция внутри ФА ~)
   if(' )/|'.indexOf(w)>=0){f_tr2=0;out+='</span>'+w;continue;}
   out+=w; continue; //остальное игнорим
  }
  if(!f_en)if(en3.indexOf(w)>0){f_en=1;out+='<a>'+w;continue;}
  if(f_en){//англ слово внутри ФА
   if(en3.indexOf(w)<0){f_en=0;out+='</a>'+w;continue;}
   out+=w; continue; //остальное игнорим
  }
  if(!f_b)if(ru2.indexOf(w)>0){f_b=1;out+='<b>'+w;continue;}
  if(f_b){//загл рус внутри ФА это звуки
   if(ru2.indexOf(w)<0){f_b=0;out+='</b>'+w;continue;}
   out+=w; continue; //остальное игнорим
  }
  if(!f_i)if(w==='*'){f_i=1;out+='<i>*';continue;}
  if(f_i){//перевод внутри ФА *
   if(ru3.indexOf(w)<0){f_i=0;out+='</i>';}
  }
  out+=w;
 }
 out=one_sp(out);
 return out.trim();
}

// ═══════════════════════════════════════════════════
//  УТИЛИТЫ
// ═══════════════════════════════════════════════════
function el(id){var e=document.getElementById(''+id);if(!e)alert('нет элемента='+id); return e;}
function in_str(s,w){return (s.indexOf(w)<0)? 0:1;}
function in_arr(m,w){return (m.includes(w))? 1:0;}
function replace_all(s,a,b){return (''+s).split(''+a).join(''+b);}
function one_sp(s){return s.replace(/[ ]+/g,' ');}
function clear_arr(m){var s,i,out=[];
 for(i=0;i<m.length;i++){s=m[i].trim();if(s) out.push(s);}
 return out;
}

function parseMatrText(txt) {var m,out=[],i,s,p,ru,en,mn;
  m = txt.split('\n');
  for(i=0; i < m.length; i++) {
    s=m[i].trim(); if(!s) continue; if(in_str(s,'`')) continue;
    p=s.split('/'); if(p.length < 2) continue;
    ru = p.shift(); ru=replace_all(ru,',',', '); ru=one_sp(ru);
    en = p.shift().trim();
    mn = p.join('/').trim();
    if(ru && en) out.push({ ru: ru, en: en, mn: mn });
  }
  return out;
}

// Назначаем onclick на все <a> внутри контейнера
function attachSpeechToLinks(container) {
  var links = container.getElementsByTagName('a');
  for (var i = 0; i < links.length; i++) {
    (function(elm) {
      elm.onclick = function(e) {
        e.stopPropagation();
        var txt = elm.textContent || elm.innerText || '';
        speakWord(txt.trim());
      };
    })(links[i]);
  }
}

// --- Speech Synthesis ---
function speakWord(enText){
  if (!('speechSynthesis' in window)) return;
  let cleanWord = enText.split('[')[0].split(',')[0].split(';')[0].trim();
  cleanWord = cleanWord.replace(/[^a-zA-Z\s\-]/g, '').trim();
  if(!cleanWord) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(cleanWord);
  utterance.lang = 'en-US';
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang.startsWith('en'));
  if(enVoice) utterance.voice = enVoice;
  window.speechSynthesis.speak(utterance);
}
if('speechSynthesis' in window){
  window.speechSynthesis.getVoices();
  if(window.speechSynthesis.onvoiceschanged !== undefined){
    window.speechSynthesis.onvoiceschanged = function(){
      window.speechSynthesis.getVoices();
    };
  }
}

function autoLoadMyWords() {
  closeMenu();
  var old = el('__mywords_script');
  if (old) old.parentNode.removeChild(old);

  var scr = document.createElement('script');
  scr.id = '__mywords_script';
  // Без cache-bust для локальных файлов, чтобы не ломать file://
  var isFile = window.location.protocol === 'file:';
  scr.src = 'my_words.js.txt' + (isFile ? '' : '?' + Date.now()); 
  
  scr.onload = function() {
    if(typeof g_words !== 'undefined' && g_words) {
      var lines = ('' + g_words).split('\n');
      var arr = loadKnownWords();
      var changed = false, addedCount = 0;
      for(var i = 0; i < lines.length; i++) {
        var w = normWord(lines[i]); if(!w) continue;
        if(!in_arr(arr,w)){arr.push(w); changed = true; addedCount++; }
      }
      if(changed) {
        saveKnownWords(arr);
        alert('Загружено из my_words.js.txt: ' + addedCount + ' слов.');
      } else {alert('Файл my_words.js.txt загружен, новых слов не найдено.');}
    } else {alert('Файл загружен, но переменная g_words не найдена.');}
  };
  scr.onerror = function(){alert('Файл my_words.js.txt не найден рядом с HTML.');};
  document.head.appendChild(scr);
}

function shuffle(array){var i,j,s;
  for (i = array.length - 1; i > 0; i--) {
    j = Math.floor(Math.random() * (i + 1));
    s = array[i]; array[i] = array[j]; array[j] = s;
  }
}

function find_en_words(txt,f){var i,j,m,s,out=[];
 var en='-qwertyuiopasdfghjklzxcvbnm';
 txt=replace_all(txt,';','\n');
 txt=replace_all(txt,'+','\n');
 m=txt.split('\n');
 for(i=0;i<m.length;i++){
   s=m[i].toLowerCase().trim(); 
   for(j=0; j<s.length; j++)if(!in_str(en,s.charAt(j)))break;
   s=s.substring(0,j);
   if(s && s!=='-')out.push(s);
 }
 if(f==='add'){//добавим в выученные слова
   m=loadKnownWords();j=m.length;
   for(i=0;i<out.length;i++)if(!in_arr(m,out[i]))m.push(out[i]);
   if(m.length>j)saveKnownWords(m);
 }
 if(f==='del'){//удалим из выученных слов
   m=loadKnownWords();j=m.length;
   for(i=0;i<m.length;i++)if(in_arr(out,m[i]))m[i]='';
   m=clear_arr(m);
   if(m.length<j)saveKnownWords(m);
 }
  
 return out;
}

function showError() {
  e_ruWord.innerText = 'ОШИБКА';

function startDeck() {
  el('totalCount').innerText = matrWords.length;
  // Filter out known words and shuffle
  g_deck = matrWords.filter(w => !matrKnown.includes(w.ru));
  shuffle(g_deck);
  updateProgress();
  if(g_deck.length > 0){
    loadCard(g_deck[0]);
    e_card.style.display = 'block';
    e_end.style.display = 'none';
    document.querySelector('.controls').style.display = 'flex';
  } else showEndScreen();
}

function loadCard(wordObj){
  isFlipped = false;
  e_card.classList.remove('is-flipped');
  e_card.style.transform = '';
  // Reset scroll position on the card back
  document.querySelector('.card-back').scrollTop = 0;
  e_ruWord.innerText = wordObj.ru;
  e_ruWord2.innerText = wordObj.ru;
  find_size_font1();
  // Parse English word, transcription, and translation dynamically
  var en = zv_zagl(wordObj.en);
  en=replace_all(en,'+',' + <br>');
  en=replace_all(en,';','<br>');
  e_enWord.innerHTML = en; attachSpeechToLinks(e_enWord);

  // Highlight english words in mnemonic
  mn = wordObj.mn;
  mn=replace_all(mn,'/','@');
  mn=zv_zagl(mn);
  mn=replace_all(mn,'@','<hr>');
  e_mnWord.innerHTML = mn;
  setTimeout(find_size_font2,10);
}

let wasDragged = false;

e_card.addEventListener('click', (e) => {

  if (e.target.closest('button')) return;
  e_card.classList.add('is-flipped');

function handleAnswer(knowIt) {
  if (g_deck.length === 0) return;
  const word = g_deck.shift(); // Remove from front

  if(knowIt){
    matrKnown.push(word.ru); find_en_words(word.en,'add');
    localStorage.setItem('matr_known', matrKnown.join('\n'));
// Milestone confetti (every 10 words, or if finished)
    if(matrKnown.length % 10 === 0) fireConfetti();
  } else g_deck.push(word); //в конец колоды
  g_otkat=[word,knowIt];//для отката на шаг назад
  updateProgress();
  if(g_deck.length > 0) loadCard(g_deck[0]);
  else {fireConfetti(); showEndScreen();}
}
function updateProgress() {
  const total = matrWords.length;
  if (total === 0) return;
  const known = matrKnown.length;
  el('knownCount').innerText = known;
  const percent = (known / total) * 100;
  el('progressBar').style.width = percent + '%';
}
function resetProgress(){
  closeMenu();
  if(confirm('Вы уверены, что хотите сбросить весь прогресс (выучено ' + matrKnown.length + ' слов)?')) {
    matrKnown = [];
    localStorage.removeItem('matr_known');
    startDeck();
  }
}
function showEndScreen() {
  e_card.style.display = 'none';
  document.querySelector('.controls').style.display = 'none';
  e_end.style.display = 'flex';
}

// --- Swipe Logic ---
let startX = 0;
let startY = 0;
let currentX = 0;
let currentY = 0;
let isDragging = false;
const threshold = 100; // pixels to trigger swipe

e_card.addEventListener('mousedown', dragStart);
e_card.addEventListener('touchstart', dragStart, {passive: true});
document.addEventListener('mousemove', dragMove);
document.addEventListener('touchmove', dragMove, {passive: false});
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchend', dragEnd);

function dragStart(e) {
  if (e.target.closest('.close-modal') || e.target.closest('button')) return;
  isDragging = true;
  wasDragged = false;
  dragDistance = 0;
  e_card.classList.add('swiping');
  startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
  startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
}

function dragMove(e) {
  if (!isDragging) return;
  const x = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
  const y = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
  currentX = x - startX;
  currentY = y - startY;

  dragDistance = Math.sqrt(currentX * currentX + currentY * currentY);
  if (dragDistance > 10) {
    wasDragged = true;
  }

  // Prevent scrolling while swiping horizontally
  if (Math.abs(currentX) > Math.abs(currentY)) {
    if (e.cancelable) e.preventDefault();
  }

  const rotate = currentX * 0.05;
  let transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;
  if(isFlipped) transform += ' rotateY(180deg)';

  e_card.style.transform = transform;

  // Stamp opacity (set on both front and back faces)
  const yeahStamps = document.querySelectorAll('.stamp-yeah');
  const nopeStamps = document.querySelectorAll('.stamp-nope');

  if(currentX > 30) {
    const opacity = Math.min(1, (currentX - 30)/120);
    yeahStamps.forEach(el => el.style.opacity = opacity);
    nopeStamps.forEach(el => el.style.opacity = 0);
  } else if(currentX < -30) {
    const opacity = Math.min(1, (Math.abs(currentX) - 30)/120);
    nopeStamps.forEach(el => el.style.opacity = opacity);
    yeahStamps.forEach(el => el.style.opacity = 0);
  } else {
    nopeStamps.forEach(el => el.style.opacity = 0);
    yeahStamps.forEach(el => el.style.opacity = 0);
  }
}

function dragEnd(e){
  if (!isDragging) return;
  isDragging = false;
  e_card.classList.remove('swiping');

  const yeahStamps = document.querySelectorAll('.stamp-yeah');
  const nopeStamps = document.querySelectorAll('.stamp-nope');

  // Reset stamps opacity
  setTimeout(() => {
    if (!isDragging) {
      yeahStamps.forEach(el => el.style.opacity = 0);
      nopeStamps.forEach(el => el.style.opacity = 0);
    }
  }, 50);

  if (currentX > threshold) {
    animateSwipeOut(window.innerWidth, currentY, true);
  } else if (currentX < -threshold) {
    animateSwipeOut(-window.innerWidth, currentY, false);
  } else {
    // Snap back
    e_card.style.transform = isFlipped ? 'rotateY(180deg)' : '';
  }
  currentX = 0;
  currentY = 0;
}

function triggerSwipe(dir) {
  const x = dir === 'right' ? window.innerWidth : -window.innerWidth;
  animateSwipeOut(x, 0, dir === 'right');
}

function animateSwipeOut(x, y, knowIt) {
  const rotate = x * 0.05;
  let transform = `translate(${x}px, ${y + 100}px) rotate(${rotate}deg)`;
  if(isFlipped) transform += ' rotateY(180deg)';
  e_card.style.transform = transform;

  // Show stamps on swipe out transition
  const yeahStamps = document.querySelectorAll('.stamp-yeah');
  const nopeStamps = document.querySelectorAll('.stamp-nope');
  if (knowIt) {
    yeahStamps.forEach(el => el.style.opacity = 1);
  } else {
    nopeStamps.forEach(el => el.style.opacity = 1);
  }

  setTimeout(() => {
    handleAnswer(knowIt);
    yeahStamps.forEach(el => el.style.opacity = 0);
    nopeStamps.forEach(el => el.style.opacity = 0);
  }, 300);
}
function find_size_font1(){var w,k,n;
  k=document.querySelector('.card-front');
  w=document.querySelector('#ruWord1');
  k.style.visibility = 'hidden';
  for(n=140;n>20;n=n-2){
   e_ruWord.style.fontSize = n+'px';
   //console.log('1font='+n);
   if((k.scrollHeight-48) >= w.scrollHeight)if((k.scrollWidth -48) >= w.scrollWidth)break;
  }
  k.style.visibility = '';
}

function find_size_font2(){
  const k = document.querySelector('.card-back');
  const w = document.querySelector('.card-back-content');
  w.style.overflow = 'hidden';
  let low = 20, high = 100, best = 20;
  while (low <= high) {
    let mid = Math.floor((low + high) / 2);
    k.style.setProperty('--card-fs', mid + 'px'); 
    //console.log('2font='+mid);
    if ((k.clientHeight - 20) >= w.scrollHeight){ best = mid; low = mid + 1;} 
    else high = mid - 1;
  }
  k.style.setProperty('--card-fs', best + 'px');
  w.style.overflow = 'auto';
}
