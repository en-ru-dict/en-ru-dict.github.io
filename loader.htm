WHILE в-то-время-как|*пока ВАлИЛ лес, ВОЛки пришли посмотреть, даже(yet) ЙЕТи вылез позырить, что за шум а драки нет

var g_size=[];
var g_tm=0;
var g_num=0;
var g_slides=document.querySelectorAll('.slide');
var g_idx=0;
function set_timer(){g_timer_start=performance.now();}
function get_timer(){return performance.now()-g_timer_start;}
function rnd(k){return window.crypto.getRandomValues(new Uint32Array(1)) % k;}

function start(){
  g_text=g_text.replace(/\|/g,'<br>').split('\n').map(z=>z.trim()).filter(z=>z);
  precalc(); g_num=rnd(g_text.length); g_idx = 1;
  updateSlides();
  setupEventListeners();
}
function updateSlides(){
  g_slides.forEach((slide,index)=>{var v;
    slide.classList.remove('left','center','right');
    slide.style.overflow='hidden';
    if(index === idx_prev()){
      v=txt_prev();
      slide.innerHTML=g_text[v];
      slide.style.fontSize=g_size[v]+'px';
      slide.classList.add('left');
    }
    if(index === g_idx){
      slide.classList.add('center');
      slide.innerHTML=g_text[g_num];
      v=g_size[g_num];
      slide.style.fontSize=v+'px';
      document.title=v;
    }
    if(index === idx_next()){
      v=txt_next();
      slide.innerHTML=g_text[v];
      slide.style.fontSize=g_size[v]+'px';
      slide.classList.add('right');
    }
  });
  clearTimeout(g_tm);
  g_tm=setTimeout(txt_over,1500);
}
function nextSlide(){ g_idx = idx_next(); g_num = txt_next(); updateSlides();}
function prevSlide(){ g_idx = idx_prev(); g_num = txt_prev(); updateSlides();}
function idx_prev(){var v=g_idx-1;if(v<0)v=3-1;return v;}
function idx_next(){var v=g_idx+1;if(v>=3)v=0;return v;}
function txt_prev(){var v=g_num-1;if(v<0)v=g_text.length-1;return v;}
function txt_next(){var v=g_num+1;if(v>=g_text.length)v=0;return v;}
function txt_over(){var e_sl = document.querySelector('.slide.center');e_sl.style.overflow='auto';}

function precalc(){
  var v,i,e = document.querySelector('.slide.center');
  e.style.transition='none'; // all 1s;'
  for(i=0;i<g_text.length;i++){v=g_text[i]; v=find_size_font(e,v); g_size.push(v);}
  e.style.transition='';
}
function find_size_font(e,txt){var low=30, high=150, best=30, mid, n, h, w;
  e.innerHTML=txt; h = e.clientHeight; w = e.clientWidth;
  while(low <= high){
    mid = Math.floor((low + high) / 2);
    e.style.fontSize = mid + 'px';
    if(e.scrollHeight <= h && e.scrollWidth <= w){ best = mid; low = mid + 1;}
    else { high = mid - 1; }
  }
  for(n=best; n>20; n--){
    e.style.fontSize = n + 'px';
    if(e.scrollHeight <= h && e.scrollWidth <= w) return n;
  }
  return 20;//min
}
function setupEventListeners(){
  document.querySelector('.next').addEventListener('click', ()=>{nextSlide();});
  document.querySelector('.prev').addEventListener('click', ()=>{prevSlide();});
  let touchStartX = 0;
  let touchEndX = 0;
  document.querySelector('.slider-wrapper').addEventListener('touchstart', (e)=>{
   touchStartX = e.changedTouches[0].screenX;
  });
  document.querySelector('.slider-wrapper').addEventListener('touchend', (e)=>{
   touchEndX = e.changedTouches[0].screenX; handleSwipe();
  });
}
function handleSwipe(){
  const swipeThreshold = 50;
  if(touchEndX < touchStartX - swipeThreshold){nextSlide();}
  if(touchEndX > touchStartX + swipeThreshold){prevSlide();}
}
start();
